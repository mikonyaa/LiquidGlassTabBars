name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
    tags: ["[0-9]*.[0-9]*.[0-9]*", "v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_PROJECT: Examples/LiquidGlassDemo/LiquidGlassDemo.xcodeproj
  DEMO_SCHEME: LiquidGlassDemo

jobs:
  full:
    name: Full · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compatibility
            runner: macos-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          - name: current
            runner: macos-26
            developer_dir: /Applications/Xcode_26.5.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    # The full real-tap matrix also runs on the slower compatibility runner.
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint
      - name: Install checksum-pinned XcodeGen
        run: |
          Scripts/install_xcodegen.sh "$RUNNER_TEMP/pinned-xcodegen"
          echo "$RUNNER_TEMP/pinned-xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Record tools and revision
        run: |
          mkdir -p "$RUNNER_TEMP/liquid-validation"
          {
            git rev-parse HEAD
            swift --version
            xcodebuild -version
            swiftlint version
            xcodegen --version
          } | tee "$RUNNER_TEMP/liquid-validation/toolchain.txt"
      - name: Test package and lint
        run: |
          swift test | tee "$RUNNER_TEMP/liquid-validation/package.log"
          swiftlint lint --strict
      - name: Build demo
        run: |
          xcodebuild -project "$DEMO_PROJECT" -scheme "$DEMO_SCHEME" \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: External released and candidate consumers
        env:
          LIQUID_CONSUMER_OUTPUT: ${{ runner.temp }}/liquid-consumers
        run: Scripts/validate_consumers.sh | tee "$RUNNER_TEMP/liquid-validation/consumers.log"
      - name: Hosted and UI integration tests
        env:
          LIQUID_TEST_OUTPUT: ${{ runner.temp }}/liquid-validation/ui
        run: Scripts/test_ui.sh > "$RUNNER_TEMP/liquid-validation/ui.log" 2>&1
      - name: Reproduce checked-in project twice
        run: |
          test "$(xcodegen --version | awk '{print $2}')" = '2.45.4'
          (cd Examples/LiquidGlassDemo && xcodegen generate && xcodegen generate)
          git diff --exit-code -- "$DEMO_PROJECT/project.pbxproj" "$DEMO_PROJECT/xcshareddata/xcschemes"
      - name: Check documentation links and hygiene
        run: |
          ruby -e 'Dir["**/*.md"].reject { |f| f.start_with?(".build/", "DerivedData") }.each { |file| File.read(file).scan(/\[[^\]]*\]\(([^)]+)\)/).flatten.each { |link| next if link.start_with?("http", "#", "mailto:"); path = link.split("#", 2).first.delete_prefix("<").delete_suffix(">"); next if path.empty?; abort("Missing #{path} from #{file}") unless File.exist?(File.expand_path(path, File.dirname(file))) } }'
          if git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|xcuserdata|DerivedData|\.build)(/|$)|\.(xcuserstate|xccheckout)$'; then
            exit 1
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/liquid-validation/*.txt
            ${{ runner.temp }}/liquid-validation/*.log
            ${{ runner.temp }}/liquid-validation/ui/*.xcresult
