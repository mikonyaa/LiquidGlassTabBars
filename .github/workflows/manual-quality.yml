name: Manual Release Quality
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: manual-release-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-quality:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Ensure SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint
      - name: Install checksum-pinned XcodeGen
        run: |
          Scripts/install_xcodegen.sh "$RUNNER_TEMP/pinned-xcodegen"
          echo "$RUNNER_TEMP/pinned-xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Automatic package, consumer and generation gates
        env:
          LIQUID_CONSUMER_OUTPUT: ${{ runner.temp }}/liquid-consumers
        run: |
          swift --version
          xcodebuild -version
          swiftlint version
          xcodegen --version
          swift test
          swiftlint lint --strict
          Scripts/validate_consumers.sh
          (cd Examples/LiquidGlassDemo && xcodegen generate && xcodegen generate)
          git diff --exit-code -- Examples/LiquidGlassDemo/LiquidGlassDemo.xcodeproj
      - name: Clean unsigned device archive
        run: |
          xcodebuild -project Examples/LiquidGlassDemo/LiquidGlassDemo.xcodeproj \
            -scheme LiquidGlassDemo -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiquidGlassDemo.xcarchive" CODE_SIGNING_ALLOWED=NO clean archive
          test -d "$RUNNER_TEMP/LiquidGlassDemo.xcarchive"
      - name: Record human and external gates separately
        run: |
          {
            echo '## Human and external gates (not completed by this workflow)'
            echo '- [ ] iOS 17 runtime smoke test when unavailable on hosted runners'
            echo '- [ ] Physical iPhone: Liquid Glass and home indicator'
            echo '- [ ] VoiceOver, Reduce Motion/Transparency on physical device'
            echo '- [ ] iPad multitasking / multiple windows review'
            echo '- [ ] Screenshot and GIF visual review'
            echo '- [ ] Independent developer integration pilot'
            echo '- [ ] Release notes, version and publication decision'
          } >> "$GITHUB_STEP_SUMMARY"
